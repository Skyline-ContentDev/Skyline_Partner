<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Checkbox</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  .box-wrap {
    display: block;
    width: 100%;
    height: 100%;
  }

  input[type="checkbox"] {
    display: none;
  }

  .box {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    border: 2px solid #010035;
    border-radius: 4px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .box svg {
    width: 75%;
    height: 75%;
    display: none;
  }

  input:checked + .box {
    border-color: #010035;
  }

  input:checked + .box svg {
    display: block;
  }
</style>
</head>
<body>

<label class="box-wrap">
  <input type="checkbox" id="chk">
  <span class="box">
    <svg viewBox="0 0 24 24">
      <path d="M4 12l6 6L20 6" fill="none" stroke="#d0271d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
</label>

</body>
</html>
