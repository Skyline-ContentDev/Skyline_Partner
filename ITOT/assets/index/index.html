<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<style id="mighty-reset-css">/* Basic reset - lowest priority */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: sans-serif; line-height: 1.5; }</style><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Vision: Adaptive Segmentation Maturity Roadmap</title>
<style>
  :root{
    /* EDGE colors */
    --cyan:#16bdeb;
    --navy:#20365d;
    --navy-dark:#000824;
    /* Grays and chartreuse */
    --chartreuse:#ccd814;
    --gray:#63666a;
    --gray-light:#d9d8d7;

    --void:#FAFAF9;
    --panel:#FFFFFF;
    --text:var(--navy-dark);
    --muted:var(--gray);
    --line:rgba(32,54,93,.12);
    --line2:rgba(32,54,93,.05);
    --accent:var(--cyan);
    --accent-soft:rgba(22,189,235,.22);
    --font:inherit, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--void);color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;}

  /* ====== background ====== */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--void);}
  #bg .grid{position:absolute;inset:-2px;
    background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(130% 100% at 50% 40%,#000 35%,transparent 100%);
            mask-image:radial-gradient(130% 100% at 50% 40%,#000 35%,transparent 100%);opacity:.7}
  #bg .glow{position:absolute;width:50vmax;height:50vmax;border-radius:50%;filter:blur(55px);
    left:50%;top:38%;transform:translate(-50%,-50%);transition:background .9s ease;
    background:radial-gradient(circle,var(--accent-soft),transparent 65%);opacity:1}

  /* ====== hint pill ====== */
  .hint{position:fixed;left:50%;bottom:88px;z-index:9;transform:translateX(-50%);pointer-events:none;
    display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
    background:rgba(0,8,36,.85);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.01em;
    box-shadow:0 8px 22px -6px rgba(0,8,36,.35);transition:opacity .5s ease,transform .5s ease;white-space:nowrap;}
  .hint svg{width:15px;height:15px;flex:0 0 auto}
  .hint.hidden{opacity:0;transform:translateX(-50%) translateY(8px);}

  /* ====== stage ====== */
  .stage{position:relative;z-index:2;flex:1;overflow:hidden;cursor:grab;touch-action:pan-y}
  .stage.dragging{cursor:grabbing}
  .track{position:absolute;top:0;left:0;height:100%;will-change:transform}
  .pipe-svg{position:absolute;inset:0;width:100%;height:100%}

  /* milestone nodes: solid, opaque, version number only */
  .node{position:absolute;z-index:6;transform:translate(-50%,-50%);cursor:pointer;
    width:62px;height:62px;pointer-events:auto}
  .node .ring-outer{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--na);opacity:0;transition:opacity .4s}
  .node .body{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:#fff;border:2px solid var(--na);
    box-shadow:0 0 0 5px var(--void),0 8px 20px -8px var(--na-shadow);
    transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s}
  .node .ver-tag{font-size:14px;font-weight:700;color:var(--na);letter-spacing:.01em}
  .node.active .body{transform:scale(1.16);
    box-shadow:0 0 0 5px var(--void),0 0 46px 2px var(--na-shadow)}
  .node.active .ring-outer{opacity:1;animation:pulse-ring 2.2s ease-out infinite}
  .node.reached .body{box-shadow:0 0 0 5px var(--void),0 0 20px -4px var(--na-shadow)}
  .node.pulse-once .body{animation:bloom .6s ease-out}
  @keyframes pulse-ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.7);opacity:0}}
  @keyframes bloom{0%{box-shadow:0 0 0 5px var(--void),0 0 40px 0 var(--na)}
                    100%{box-shadow:0 0 0 5px var(--void),0 0 20px -4px var(--na-shadow)}}

  /* traveller: GPS-style directional marker with a steady glow */
  .traveller{position:absolute;z-index:3;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none}
  .traveller::before{content:'';position:absolute;inset:-18px;border-radius:50%;
    background:radial-gradient(circle,var(--accent-soft),transparent 68%)}
  .trv-arrow{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--navy)}
  .trv-arrow svg{width:22px;height:22px;transform:rotate(90deg);filter:drop-shadow(0 0 10px var(--accent)) drop-shadow(0 2px 4px rgba(0,8,36,.35))}
  .trv-trail{position:absolute;z-index:3;width:5px;height:5px;border-radius:50%;
    background:var(--accent);pointer-events:none;box-shadow:0 0 6px var(--accent);opacity:0}

  /* cards */
  .card{position:absolute;z-index:5;width:min(84vw,380px);pointer-events:auto;
    background:rgba(255,255,255,.97);border:1px solid var(--na-border);
    border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);
    box-shadow:0 16px 40px -16px rgba(0,8,36,.16),0 0 32px -8px var(--na-shadow);opacity:0;transition:opacity .5s,transform .5s}
  .card.show{opacity:1}
  .card h3{font-weight:700;font-size:17px;margin:0 0 4px;color:var(--text)}
  .card .subtitle{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:9px}
  .card.intro .subtitle{color:var(--text);font-size:13px}
  .features{display:flex;flex-direction:column;gap:6px}
  .feat{padding:7px 11px;border-radius:9px;background:rgba(32,54,93,.03);border:1px solid var(--line)}
  .feat .feat-name{font-weight:600;font-size:12.5px;color:var(--text);margin-bottom:2px}
  .feat .feat-desc{font-size:11.5px;line-height:1.4;color:var(--navy)}

  /* ====== controls: icon-only ====== */
  .controls{position:fixed;bottom:0;left:0;right:0;z-index:10;
    padding:10px 22px 16px;display:flex;align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(180deg,transparent,rgba(250,250,249,.9) 40%,rgba(250,250,249,1));pointer-events:auto}
  .nav-btn{cursor:pointer;display:flex;align-items:center;justify-content:center;
    width:46px;height:46px;border-radius:50%;
    color:#fff;background:var(--navy);border:none;box-shadow:0 4px 14px -4px rgba(0,8,36,.3);
    transition:box-shadow .25s,transform .15s,background .25s,opacity .3s}
  .nav-btn:hover:not(.disabled){box-shadow:0 8px 20px -4px rgba(0,8,36,.35);transform:translateY(-2px);background:var(--cyan)}
  .nav-btn svg{width:20px;height:20px;color:#fff}
  .nav-btn.disabled{opacity:.25;pointer-events:none}
  .nav-dot-row{display:flex;gap:8px;align-items:center}
  .nav-dot{width:9px;height:9px;border-radius:50%;cursor:pointer;
    background:var(--gray-light);transition:background .3s,transform .2s,box-shadow .3s}
  .nav-dot.active{background:var(--cyan);transform:scale(1.35);box-shadow:0 0 10px -2px var(--cyan)}
  .nav-dot:hover{transform:scale(1.2)}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
  @media(max-width:820px){
    .card{padding:14px 16px;width:min(88vw,340px)}
    .controls{padding:8px 14px 14px}
    .hint{bottom:78px;font-size:11.5px;padding:8px 14px}
  }
  @media(prefers-reduced-motion:reduce){.node.active .ring-outer,.node.pulse-once .body{animation:none}}
</style>
<script id="mighty-interactive-sdk" src="../../mighty/sdk/v1/mighty-interactive-sdk.min.js"></script></head>
<body>
<div id="bg"><div class="grid"></div><div class="glow"></div></div>

<div class="hint" id="hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l-6 8 6 8M15 4l6 8-6 8"></path></svg>
  Drag or use the arrows to drive the roadmap
</div>

<div class="stage" id="stage">
  <div class="track" id="track">
    <svg class="pipe-svg" viewBox="0 0 3800 1000" preserveAspectRatio="none">
      <defs>
        <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="3800" y2="0">
          <stop offset="0" stop-color="#20365d"></stop>
          <stop offset="1" stop-color="#16bdeb"></stop>
        </linearGradient>
        <linearGradient id="pgSoft" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="3800" y2="0">
          <stop offset="0" stop-color="#20365d" stop-opacity=".18"></stop>
          <stop offset="1" stop-color="#16bdeb" stop-opacity=".18"></stop>
        </linearGradient>
      </defs>
      <path id="pipeShell" fill="none" stroke="#d9d8d7" stroke-width="30" stroke-linecap="round"></path>
      <path id="pipeOutline" fill="none" stroke="rgba(32,54,93,.14)" stroke-width="32" stroke-linecap="round"></path>
      <path id="pipeDash" fill="none" stroke="rgba(99,102,106,.4)" stroke-width="2" stroke-dasharray="4 20" stroke-linecap="round"></path>
      <path id="pipeLit" fill="none" stroke="url(#pg)" stroke-width="7" stroke-linecap="round"></path>
      <path id="pipeGlow" fill="none" stroke="url(#pgSoft)" stroke-width="40" stroke-linecap="round" opacity="0"></path>
    </svg>
    <div class="traveller" id="traveller">
      <div class="trv-arrow" id="trvArrow">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l7 20-7-5-7 5 7-20z"></path></svg>
      </div>
    </div>
  </div>
</div>

<div class="controls" id="controls">
  <button class="nav-btn prev" id="prevBtn" aria-label="Previous stop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg>
  </button>
  <div class="nav-dot-row" id="dotRow"></div>
  <button class="nav-btn next" id="nextBtn" aria-label="Next stop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
  </button>
</div>

<script>
/* ============================================================
   CYBER VISION MATURITY ROADMAP: drivable horizontal timeline
   Content supplied by the SME; presentation layer only below.
   EDGE palette only: cyan, navy, grays.
   No external font or animation-library dependencies.
   ============================================================ */
const INTRO = {
  title: "The Segmentation Maturity Roadmap",
  subtitle: "Cisco Cyber Vision continues to expand what organizations can accomplish with network segmentation. This roadmap highlights the major milestones and shows how each release expanded the platform's ability to simplify OT segmentation. Drive the road to see what shipped at each release.",
  accent: "#20365d",
  anchor: [300, 170]
};

const MILESTONES = [
  {
    ver: "5.2.x", phase: "Suggestions Seeded", accent: "#16bdeb",
    title: "Suggestions Seeded",
    subtitle: "Groundwork, still partly beta: the segmentation model gets stated plainly.",
    features: [
      { name: "Re-runnable Group Suggestions",
        desc: "Regenerate functional group suggestions on demand from the Communications page: analyze, refine, repeat." },
      { name: "Multi-scope Rerun",
        desc: "Run the analysis for one sensor, one asset, an existing group, or all Center data." },
      { name: "Zone Views in the Map",
        desc: "Group assets by subnet or functional group and filter communications by time window." }
    ],
    anchor: [1100, 170]
  },
  {
    ver: "5.3.x", phase: "AI Grouping Goes GA", accent: "#16bdeb",
    title: "AI Grouping Goes GA",
    subtitle: "Auto-grouping stops being a beta bolt-on and becomes the default method, meaningfully smarter.",
    features: [
      { name: "AI Asset Clustering",
        desc: "A built-in clustering method for automatically grouping assets, now generally available." },
      { name: "Property and Comms Grouping",
        desc: "Suggests groups from shared properties, not only communication patterns, catching zone-mates by identity." },
      { name: "Zone-centric Map and Splunk",
        desc: "See traffic between configured groups; drill into inter-asset flows. Splunk app for posture dashboards." }
    ],
    anchor: [1900, 170]
  },
  {
    ver: "5.5.x", phase: "Enterprise-Ready", accent: "#16bdeb",
    title: "Enterprise-Ready",
    subtitle: "Not another AI-grouping leap; this one is about making enforcement direct, predictable, and scalable.",
    features: [
      { name: "Direct ISE API Sync",
        desc: "Synchronize network groups and their SGTs straight into ISE via the API, a more direct path than pxGrid context." },
      { name: "Network-based Auto Grouping",
        desc: "Deterministic grouping along your network definitions, purpose-built to feed the ISE API cleanly." },
      { name: "Site Manager and Risk to ISE",
        desc: "Single-pane view of every Local Center; Risk Score sent to ISE as a custom attribute for posture-aware policy." }
    ],
    anchor: [2700, 170]
  },
  {
    ver: "5.6.x", phase: "Segmentation Goes Native", accent: "#16bdeb",
    title: "Native Segmentation",
    subtitle: "Enforcement moves beyond ISE alone: Cyber Vision can now push segmentation policies straight to switches itself.",
    features: [
      { name: "Native Policy Enforcement",
        desc: "Cyber Vision pushes segmentation policies straight to industrial switches, without adding new appliances." },
      { name: "Standalone or ISE-Assisted",
        desc: "Customers without ISE can rely on Cyber Vision alone for enforcement. Customers with ISE keep using it alongside Cyber Vision." }
    ],
    anchor: [3500, 170]
  }
];

/* STOPS drives navigation and cards (intro + all milestones, in road order).
   Node markers on the road are built from MILESTONES only, since the intro
   stop has no version number to show. */
const STOPS = [INTRO, ...MILESTONES];

const VBW = 3800, VBH = 1000;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const root = document.documentElement;
const stage = document.getElementById("stage"), track = document.getElementById("track");
const traveller = document.getElementById("traveller"), trvArrow = document.getElementById("trvArrow");
const pipeLit = document.getElementById("pipeLit");
const pipeGlow = document.getElementById("pipeGlow");
const prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn");
const dotRow = document.getElementById("dotRow");
const hint = document.getElementById("hint");

function hexA(h, a) { const v = h.replace("#", "");
  return `rgba(${parseInt(v.slice(0, 2), 16)},${parseInt(v.slice(2, 4), 16)},${parseInt(v.slice(4, 6), 16)},${a})`; }

STOPS.forEach(s => { s._border = hexA(s.accent, .55); s._shadow = hexA(s.accent, .45); });

/* ---- dismiss hint on first interaction ---- */
let hintShown = true;
function dismissHint() { if (!hintShown) return; hintShown = false; hint.classList.add("hidden"); }
setTimeout(dismissHint, 6000);

/* ---- build dot nav: one dot per stop, including the intro ---- */
STOPS.forEach((s, i) => {
  const dot = document.createElement("div"); dot.className = "nav-dot";
  dot.title = s.ver ? (s.ver + " \u00b7 " + s.phase) : s.title;
  dot.addEventListener("click", () => { dismissHint(); goTo(i); });
  dotRow.appendChild(dot);
});

function updateNavState() {
  prevBtn.classList.toggle("disabled", activeIndex <= 0);
  nextBtn.classList.toggle("disabled", activeIndex >= STOPS.length - 1);
  [...dotRow.children].forEach((d, i) => d.classList.toggle("active", i === activeIndex));
}

/* ---- build road path: a straight line through every stop, plus a short
   lead-in and lead-out buffer that is NOT reachable by arrow navigation ---- */
const allPts = [[80, 170], INTRO.anchor, ...MILESTONES.map(m => m.anchor), [3720, 170]];
let d = `M ${allPts[0][0]} ${allPts[0][1]}`;
for (let i = 1; i < allPts.length; i++) { d += ` L ${allPts[i][0]} ${allPts[i][1]}`; }
["pipeShell", "pipeOutline", "pipeDash", "pipeLit", "pipeGlow"].forEach(id => document.getElementById(id).setAttribute("d", d));
const LEN = pipeLit.getTotalLength();
pipeLit.style.strokeDasharray = LEN; pipeLit.style.strokeDashoffset = LEN;
pipeGlow.style.strokeDasharray = LEN; pipeGlow.style.strokeDashoffset = LEN;

/* find the exact length-fraction along the path whose point.x matches a
   given anchor x, so navigating to a stop lands exactly on it (binary
   search works because the road only ever moves in the +x direction) */
function fracForX(targetX) {
  let lo = 0, hi = LEN;
  for (let i = 0; i < 26; i++) {
    const mid = (lo + hi) / 2;
    if (pipeLit.getPointAtLength(mid).x < targetX) lo = mid; else hi = mid;
  }
  return ((lo + hi) / 2) / LEN;
}
STOPS.forEach(s => { s._frac = fracForX(s.anchor[0]); });

/* ---- stop markers: opaque circles, one per stop, "Start" or version number ---- */
const nodeEls = [];
STOPS.forEach((s, i) => {
  const [x, y] = s.anchor, lp = x / VBW * 100, tp = y / VBH * 100;
  const node = document.createElement("div");
  node.className = "node";
  node.style.setProperty("--na", s.accent);
  node.style.setProperty("--na-shadow", s._shadow);
  node.style.left = lp + "%"; node.style.top = tp + "%";
  node.innerHTML = `<div class="ring-outer"></div><div class="body"><span class="ver-tag">${s.ver || "Start"}</span></div>`;
  node.addEventListener("click", () => { dismissHint(); goTo(i); });
  track.appendChild(node); nodeEls.push(node);
});

/* ---- cards: one per stop, including the intro ---- */
STOPS.forEach(s => {
  const [x, y] = s.anchor, lp = x / VBW * 100, tp = y / VBH * 100;
  const card = document.createElement("div");
  card.className = "card" + (s === INTRO ? " intro" : "");
  card.style.setProperty("--na", s.accent);
  card.style.setProperty("--na-border", s._border);
  card.style.setProperty("--na-shadow", s._shadow);
  card.style.left = lp + "%"; card.style.top = tp + "%";
  card._show = "translate(-50%, 30px)";
  card._hide = "translate(-50%, 44px)";
  card.style.transform = card._hide;
  card.innerHTML = s === INTRO
    ? `<h3>${s.title}</h3><div class="subtitle">${s.subtitle}</div>`
    : `<h3>${s.title}</h3>
       <div class="subtitle">${s.subtitle}</div>
       <div class="features">${s.features.map(f => `
         <div class="feat">
           <div class="feat-name">${f.name}</div>
           <div class="feat-desc">${f.desc}</div>
         </div>`).join("")}</div>`;
  track.appendChild(card); s._card = card; s._x = x;
});

/* trail particles behind the traveller */
const POOL = 12, trails = []; let tIdx = 0, lastTrailT = 0;
for (let i = 0; i < POOL; i++) {
  const t = document.createElement("div"); t.className = "trv-trail";
  track.appendChild(t); trails.push(t);
}
function emitTrail(lp, tp) {
  if (reduce) return;
  const now = performance.now(); if (now - lastTrailT < 80) return; lastTrailT = now;
  const t = trails[tIdx = (tIdx + 1) % POOL];
  t.style.left = lp + "%"; t.style.top = tp + "%";
  t.style.transition = "none"; t.style.opacity = ".7"; t.style.transform = "scale(1)";
  requestAnimationFrame(() => {
    t.style.transition = "opacity .7s ease, transform .7s ease";
    t.style.opacity = "0"; t.style.transform = "scale(.2)";
  });
}

/* ---- geometry ---- */
let vw = 0, vh = 0, trackW = 0, revealRadius = 0;
function measure() {
  vw = innerWidth; vh = stage.offsetHeight;
  trackW = 2 * Math.max(vw, 640);
  track.style.width = trackW + "px"; track.style.height = "100%";

  let minGap = Infinity;
  for (let i = 1; i < STOPS.length; i++) {
    const gap = (STOPS[i]._x - STOPS[i - 1]._x) / VBW * trackW;
    if (gap < minGap) minGap = gap;
  }
  revealRadius = Math.max(80, minGap / 2 - 24);
}

/* ============================================================
   RENDER
   p is the fraction of the FULL road (0 = lead-in, 1 = lead-out).
   ============================================================ */
let p = STOPS[0]._frac;
let activeIndex = 0;

function render() {
  p = Math.max(0, Math.min(1, p));
  const pt = pipeLit.getPointAtLength(p * LEN);
  const pxX = pt.x / VBW * trackW;

  track.style.transform = `translateX(${-(pxX - vw / 2)}px)`;
  traveller.style.left = (pt.x / VBW * 100) + "%";
  traveller.style.top = (pt.y / VBH * 100) + "%";

  pipeLit.style.strokeDashoffset = LEN * (1 - p);
  pipeGlow.style.strokeDashoffset = LEN * (1 - p);
  pipeGlow.setAttribute("opacity", String(.18 + .2 * p));

  /* show the one card, if any, whose stop is within reach right now */
  const centerWorldX = pxX;
  let visIndex = -1;
  STOPS.forEach((s, i) => {
    const pinPx = s._x / VBW * trackW;
    const vis = Math.abs(pinPx - centerWorldX) < revealRadius;
    if (vis) visIndex = i;
    if (vis !== s._vis) {
      s._vis = vis; s._card.classList.toggle("show", vis);
      s._card.style.transform = vis ? s._card._show : s._card._hide;
    }
  });

  /* stop marker states: reached once passed, active only while its card is shown */
  STOPS.forEach((s, i) => {
    const reached = p >= s._frac - 0.0005;
    const active = visIndex === i;
    const el = nodeEls[i];
    const wasActive = el.classList.contains("active");
    el.classList.toggle("active", active);
    el.classList.toggle("reached", reached);
    if (active && !wasActive && !reduce) {
      el.classList.remove("pulse-once");
      requestAnimationFrame(() => {
        el.classList.add("pulse-once");
        setTimeout(() => el.classList.remove("pulse-once"), 650);
      });
    }
  });

  if (visIndex >= 0 && visIndex !== activeIndex) { activeIndex = visIndex; updateNavState(); }

  if (Math.abs(p - (render._lastP || 0)) > 0.001) emitTrail(pt.x / VBW * 100, pt.y / VBH * 100);
  render._lastP = p;
}

/* ---- custom easing tween (no external animation library) ---- */
function animateP(target, duration) {
  duration = duration ?? 700;
  if (reduce) { p = target; render(); return; }
  const start = p, delta = target - start, t0 = performance.now();
  if (render._raf) cancelAnimationFrame(render._raf);
  function step(now) {
    const t = Math.min(1, (now - t0) / duration);
    const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    p = start + delta * eased;
    render();
    if (t < 1) render._raf = requestAnimationFrame(step);
  }
  render._raf = requestAnimationFrame(step);
}

function goTo(index) {
  activeIndex = Math.max(0, Math.min(STOPS.length - 1, index));
  updateNavState();
  animateP(STOPS[activeIndex]._frac);
}

/* ============================================================
   NAVIGATION: buttons, dots, nodes, keyboard, and drag.
   No wheel handler: capturing wheel events here trapped page
   scroll when this block is embedded partway down a Rise lesson.
   ============================================================ */
prevBtn.addEventListener("click", () => { dismissHint(); goTo(activeIndex - 1); });
nextBtn.addEventListener("click", () => { dismissHint(); goTo(activeIndex + 1); });

addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { e.preventDefault(); dismissHint(); nextBtn.click(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); dismissHint(); prevBtn.click(); }
});

/* drag to drive: horizontal only, so vertical page scroll (touch-action:pan-y
   on the stage) still works normally when this block sits inside a Rise page */
let dragging = false, dragStartX = 0, dragStartP = 0;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest(".card")) return;
  dragging = true; dragStartX = e.clientX; dragStartP = p;
  stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId);
  if (render._raf) cancelAnimationFrame(render._raf);
});
stage.addEventListener("pointermove", e => {
  if (!dragging) return;
  dismissHint();
  const dx = e.clientX - dragStartX;
  p = Math.max(0, Math.min(1, dragStartP - dx / trackW));
  render();
});
function endDrag() { dragging = false; stage.classList.remove("dragging"); }
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* ---- init ---- */
measure(); render(); updateNavState();
addEventListener("resize", () => { measure(); render(); });
</script>
