<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio Shelf</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="Skylinel/files/user/favicons/4d128594c6c2ca4190929765f896f47f07c04623-32.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background-color:#e8e8e8;
  background-image:url('Skylinel/files/backgrounds/back5.svg');
  background-size:cover;
  background-position:center center;
  overflow-x:hidden;
}

.header{
  text-align:center;
  padding:40px 20px 10px;
}
.header .logo{
  max-width:160px;
  margin-bottom:16px;
}
.header h1{
  font-size:2rem;
  color:#0d274d;
  margin-bottom:4px;
}
.header p{
  color:#5a6a7a;
  font-size:1rem;
}

.shelf-container{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:60px;
  padding:40px 20px 20px;
  max-width:1100px;
}

.book-card{
  perspective:1200px;
  cursor:pointer;
  text-decoration:none;
  color:inherit;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:transform 0.2s ease;
}
.book-card:hover{
  transform:translateY(-6px);
}

.book{
  width:220px;
  height:290px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.5s ease;
  will-change:transform;
  transform:rotateY(-30deg) rotateX(5deg);
}

.book-card:hover .book{
  transform:rotateY(0deg) rotateX(0deg);
}

.book .cover{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:4px 12px 12px 4px;
  overflow:hidden;
  background:#fff;
  box-shadow:
    0 8px 30px rgba(0,0,0,0.25),
    0 2px 8px rgba(0,0,0,0.15);
  backface-visibility:hidden;
  transform:translateZ(12px);
}
.book .cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.book .spine{
  position:absolute;
  width:24px;
  height:100%;
  left:-12px;
  background:linear-gradient(to right, #0d274d, #1a3e6e);
  transform:rotateY(-90deg) translateZ(0px);
  transform-origin:right center;
  border-radius:4px 0 0 4px;
}

.shelf{
  width:100%;
  max-width:1100px;
  margin:-10px auto 40px;
  padding:0 20px;
}
.shelf-board{
  height:18px;
  background:linear-gradient(to bottom, #a08060, #8b6f50, #78664e);
  border-radius:0 0 4px 4px;
  box-shadow:
    0 4px 8px rgba(0,0,0,0.2),
    inset 0 2px 4px rgba(255,255,255,0.1);
  opacity:0.43;
}

.book-label{
  margin-top:14px;
  font-size:0.95rem;
  font-weight:600;
  color:#0d274d;
  text-align:center;
}

@media(max-width:768px){
  .shelf-container{gap:40px;padding:30px 16px 16px}
  .book{width:170px;height:224px}
  .book .cover{transform:translateZ(10px)}
  .book .spine{width:20px;left:-10px}
  .header h1{font-size:1.5rem}
}
@media(max-width:480px){
  .shelf-container{gap:30px;flex-direction:column;align-items:center}
  .book{width:180px;height:236px}
}
</style>
</head>
<body>

<div class="header">
  <a href="https://skyline-ats.com/" target="_blank">
    <img src="Skylinel/files/user/logos/78d800512b8079e5a391559174b1dd65cce17b53.png" alt="Logo" class="logo">
  </a>
  <h1>Folio Shelf</h1>
  <p>Created by Skyline-ATS.</p>
</div>

<div class="shelf-container">
  <a class="book-card" href="Skylinel/index.html">
    <div class="book">
      <div class="spine"></div>
      <div class="cover">
        <img src="Skylinel/flipbook.pdf-thumb.jpg" alt="SkylineL">
      </div>
    </div>
    <span class="book-label">Basic</span>
  </a>
  <a class="book-card" href="Skylinem/index.html">
    <div class="book">
      <div class="spine"></div>
      <div class="cover">
        <img src="Skylinem/flipbook.pdf-thumb.jpg" alt="SkylineM">
      </div>
    </div>
    <span class="book-label">Standard</span>
  </a>
  <a class="book-card" href="Skylines/index.html">
    <div class="book">
      <div class="spine"></div>
      <div class="cover">
        <img src="Skylines/flipbook.pdf-thumb.jpg" alt="SkylineS">
      </div>
    </div>
    <span class="book-label">Advanced</span>
  </a>
</div>

<div class="shelf">
  <div class="shelf-board"></div>
</div>

<script>
document.querySelectorAll('.book-card').forEach(function(card){
  var book = card.querySelector('.book');
  card.addEventListener('mouseenter', function(){
    book.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });
  card.addEventListener('mouseleave', function(){
    book.style.transform = 'rotateY(-30deg) rotateX(5deg)';
  });
});
</script>

</body>
</html>
