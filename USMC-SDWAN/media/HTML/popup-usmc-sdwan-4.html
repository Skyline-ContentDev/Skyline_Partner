<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continue Learning — SD-WAN Network Deployment</title>

<style>
  :root{
    --font-display: 'Arial', 'Helvetica', sans-serif;
    --font-body: 'Arial', 'Helvetica', sans-serif;
    --accent: #e4221f;
    --accent-hover: #c01d1a;
    --card-bg: #ffffff;
    --card-border: #e6e6e6;
    --text-primary: #16181d;
    --text-secondary: #565c66;
  }
</style>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--font-body);
    background: var(--card-bg);
  }

  .page-content {
    position: relative;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 36px 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .page-glow {
    position: absolute;
    top: -60px;
    right: -60px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity: 0.08;
    z-index: -1;
    pointer-events: none;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 26px;
    line-height: 1.25;
    color: var(--text-primary);
    margin: 0 0 18px;
  }

  .course-name {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.4;
    margin: 0 0 28px;
  }

  .cta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .cta-btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    padding: 11px 20px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .cta-btn:hover { background: var(--accent-hover); }
  .cta-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

</style>
</head>
<body>

  <div class="page-content">
    <div class="page-glow"></div>

    <h1 id="popup-title">Continue Learning in Cisco U.</h1>

    <p class="course-name">Cisco SD-WAN Network Deployment</p>
    <div class="cta-row">
      <a class="cta-btn" href="https://ondemandelearning.cisco.com/apollo-alpha/tech_sdwan_fundamentalnetwork_100_20/pages/1" target="_blank" rel="noopener">Launch</a>
    </div>
  </div>

</body>
</html>
